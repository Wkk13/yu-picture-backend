# 通用配置项
server:
  port: 8080
  servlet:
    context-path: /api
    #cookie30天过期
    session:
      cookie:
        max-age: 2592000
spring:
  profiles:
    active: local
  application:
    name: yu-picture-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # 文件上传设置更大的体积
  servlet:
    multipart:
      max-file-size: 10MB
  # RabbitMQ 配置（适配4.2.5版本）
  rabbitmq:
    host: localhost          # RabbitMQ服务器地址（本地部署填localhost）
    port: 5672               # RabbitMQ默认端口（管理后台是15672，不要混淆）
    username: guest          # 默认用户名（生产环境建议新建自定义用户）
    password: guest          # 默认密码（生产环境务必修改）
    virtual-host: /          # 默认虚拟主机
    connection-timeout: 15000 # 连接超时时间（毫秒）
    # 可选：消费者配置（提升稳定性）
    listener:
      simple:
        acknowledge-mode: auto # 自动确认消息（新手推荐，生产可改为manual手动确认）
        concurrency: 1         # 最小消费者数量
        max-concurrency: 10    # 最大消费者数量

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000
  session:
    store-type: redis
    # session30天后过期
    timeout: 2592000
  ai:
    dashscope:
      api-key: ${DASH_SCOPE_API_KEY}

# MyBatis-Plus 通用配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 通用配置
knife4j:
  enable: true
  openapi:
    title: 鱼图后端接口文档
    version: v1.0
    description: 鱼图项目的后端接口文档
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.yupi.yupicturebackend.controller

# 阿里云AI配置
aliYunAi:
  apiKey: your-aliyun-api-key
  apiUrl: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  modelCode: qwen-max-2025-01-25

# 腾讯云AI配置
tencent:
  ai:
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-southeast-1





